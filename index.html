<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electric Shock Treatment Practice</title>
<style>
:root{--n:#071f2d;--p:#12364a;--y:#f6c744;--w:#f8fbfd;--m:#bfd0da;--g:#235d49;--r:#613838}*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--w);font:16px Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px}h1{margin:5px 0}.k{color:var(--y);font-size:12px;font-weight:800;letter-spacing:2px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--y);padding-bottom:14px}.bar{height:8px;background:#294657;border-radius:9px;margin:20px 0;overflow:hidden}.fill{height:100%;background:var(--y)}.card{background:var(--p);padding:30px;border-radius:14px}.level{color:var(--y);font-weight:bold;font-size:13px}.q{font-size:24px;line-height:1.45;margin:16px 0 24px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.opt{padding:18px;border:2px solid #577486;border-radius:10px;background:#0b2b3b;color:white;font-weight:bold;font-size:17px}.opt.sel{border-color:var(--y);background:#1a4154}.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button{cursor:pointer}.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:bold}.hintb{background:#e8eef2}.check,.next{background:var(--y)}.next{margin-left:auto}.box{display:none;margin-top:18px;padding:14px;border-radius:8px;line-height:1.5}.hint{background:#21485b}.good{background:var(--g)}.bad{background:var(--r)}.small{color:var(--m);line-height:1.5}.summary{display:none}.score{font-size:30px;color:var(--y);font-weight:900}.rev{background:var(--p);padding:15px;border-radius:9px;margin:10px 0}@media(max-width:600px){.head{display:block}.opts{grid-template-columns:1fr}.next{margin-left:0;width:100%}}
</style></head><body><div class="wrap">
<section id="practice"><div class="head"><div><div class="k">READING PRACTICE</div><h1>Electric Shock Treatment</h1></div><b id="prog"></b></div><div class="bar"><div id="fill" class="fill"></div></div>
<div class="card"><div id="level" class="level"></div><div id="q" class="q"></div><div class="opts"><button class="opt" data-v="1">TRUE</button><button class="opt" data-v="0">FALSE</button></div><div class="acts"><button id="hintb" class="btn hintb">Hint</button><button id="check" class="btn check">Check Answer</button><button id="next" class="btn next" style="display:none">Next Question</button></div><div id="hint" class="box hint"></div><div id="fb" class="box"></div></div>
<p class="small">Choose TRUE or FALSE. If your first answer is incorrect, use the hint, change your answer, and check again.</p></section>
<section id="summary" class="summary"><div class="head"><div><div class="k">PRACTICE COMPLETE</div><h1>Your Results</h1></div></div><div class="card" style="margin-top:20px"><div id="score" class="score"></div><p id="msg"></p><div class="acts"><button id="reviewb" class="btn hintb">Review Answers</button><button id="again" class="btn check">Try Again</button></div></div><div id="review"></div></section>
</div><script>
const Q=[
["Recognition","The first action is to turn the power off at the main.",1,"Look at Step 1. What action comes first?","Step 1 begins by turning the power off at the main.",""],
["Recognition","If the power cannot be turned off, you should stand on wet material.",0,"Focus on the word that describes the material in Step 1.","The text says to stand on dry insulated material.","If the power cannot be turned off, stand on dry insulated material."],
["Recognition","A safety hook, broom, or chair can be used as a non-conductive item to push the casualty away from the power source.",1,"Look for the examples of non-conductive items in Step 1.","These are the examples given in Step 1.",""],
["Understanding","If the casualty responds by answering or moving and is in no further danger, leave them in the position you found them.",1,"Check what Step 2 says after the casualty responds.","This is the action described in Step 2.",""],
["Understanding","After checking the casualty, you should ignore visible injuries and wait before calling an ambulance.",0,"Look at the last two actions in Step 2.","Step 2 says to check for visible injuries and call for an ambulance.","Check for visible injuries and call for an ambulance."],
["Understanding","In Step 3, you remove an obvious obstruction from the casualty's mouth and open the airway.",1,"Think about the two actions in Step 3.","Step 3 includes both actions.",""],
["Understanding","To check breathing, you only need to look at the casualty's chest.",0,"Step 4 uses three actions, not only one.","The text says to look, listen, and feel for signs of breathing.","Check breathing by looking, listening, and feeling."],
["Application","A casualty has a pulse and is breathing. According to Step 5, place the casualty in the recovery position.",1,"Match 'pulse + breathing present' with the action in Step 5.","Step 5 gives the recovery position for this condition.",""],
["Application","A casualty has a pulse but is not breathing. According to Step 5, begin CPR immediately.",0,"Compare 'pulse present, breathing absent' with 'pulse and breathing absent'.","The text gives rescue breaths when the pulse is present but breathing is absent.","If the pulse is present but breathing is absent, commence rescue breaths."],
["Application","A casualty has no pulse and no breathing. According to Step 5, commence CPR while waiting for the ambulance.",1,"Look at the final condition in Step 5.","The text says to commence CPR when both pulse and breathing are absent.",""]
];
let i=0,sel=null,tries=0,earned=Array(10).fill(false),done=Array(10).fill(false);const $=x=>document.getElementById(x);
function render(){let x=Q[i];$("prog").textContent=`Question ${i+1} of 10`;$("fill").style.width=`${(i+1)*10}%`;$("level").textContent=x[0].toUpperCase();$("q").textContent=x[1];$("hint").style.display=$("fb").style.display="none";$("next").style.display="none";sel=null;tries=0;document.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel"))}
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{sel=+b.dataset.v;document.querySelectorAll(".opt").forEach(z=>z.classList.remove("sel"));b.classList.add("sel")});
$("hintb").onclick=()=>{$("hint").textContent="Hint: "+Q[i][3];$("hint").style.display="block"};
$("check").onclick=()=>{if(sel===null){$("fb").className="box bad";$("fb").textContent="Please choose TRUE or FALSE first.";$("fb").style.display="block";return}tries++;if(sel===Q[i][2]){if(!done[i])earned[i]=true;done[i]=true;$("fb").className="box good";$("fb").innerHTML="<b>Correct!</b> "+Q[i][4];$("fb").style.display="block";$("next").style.display="block"}else if(tries===1){$("fb").className="box bad";$("fb").innerHTML="<b>Try again.</b> Read the hint, think, change your answer, and check again.";$("fb").style.display="block";$("hint").textContent="Hint: "+Q[i][3];$("hint").style.display="block"}else{done[i]=true;$("fb").className="box bad";$("fb").innerHTML="<b>Review this point.</b> "+Q[i][4];$("fb").style.display="block";$("next").style.display="block"}};
$("next").onclick=()=>{if(i<9){i++;render()}else finish()};function finish(){$("practice").style.display="none";$("summary").style.display="block";let n=earned.filter(Boolean).length,p=n*10;$("score").textContent=`Your score: ${n}/10 (${p}%)`;$("msg").textContent=p>=80?"Great job! You understand this topic well.":p>=60?"Good work. Review a few points and try again.":"Review the lesson and try the practice again."}
$("reviewb").onclick=()=>{$("review").innerHTML=Q.map((x,j)=>`<div class="rev"><b>${j+1}. ${x[1]}</b><p class="small">Correct answer: <b>${x[2]?"TRUE":"FALSE"}</b><br>${x[4]}${x[5]?`<br><b>Correction:</b> ${x[5]}`:""}</p></div>`).join("")};
$("again").onclick=()=>{i=0;earned.fill(false);done.fill(false);$("review").innerHTML="";$("summary").style.display="none";$("practice").style.display="block";render()};render();
</script></body></html>
